name: Publish shadcn-nsh CLI

# A release is a `v*` tag on a commit whose `packages/cli/package.json` has that version
# (CONTRIBUTING.md, Releasing). The CLI reads the registry at its own tag, so the tag is what ships.
# A manual run only rehearses: it packs and runs `npm publish --dry-run`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  # Seconds, and it runs before the gate: a mistyped tag fails here rather than after the whole
  # check has passed. `node` ships with the runner, so this needs no setup of its own.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The tag names the version the CLI reports and the registry it reads: they must agree.
      - name: Tag matches the CLI version
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not v${version} (packages/cli/package.json)"
            exit 1
          fi

  # The same gate as a pull request. Branch protection means the tagged commit is the
  # tree the release pull request already checked.
  check:
    needs: verify
    uses: ./.github/workflows/check.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm provenance: the package says which workflow run built it.
      id-token: write
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # setup-bun caches the executable, not the packages: `bun install` has its own cache.
      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # An LTS line: `npm publish` and provenance run here, and the package targets node20.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run build

      - name: Pack summary
        run: npm pack --dry-run

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            npm publish --access public --provenance --dry-run
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is missing; cannot publish."
            exit 1
          fi
          # A pre-release version (1.2.0-beta.1) goes to the `next` dist-tag, never `latest`.
          case "${GITHUB_REF_NAME}" in
            *-*) npm publish --access public --provenance --tag next ;;
            *) npm publish --access public --provenance ;;
          esac
