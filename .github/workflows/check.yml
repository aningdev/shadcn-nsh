name: Check

on:
  pull_request:
  workflow_dispatch:
  # A release runs the same gate first (publish-cli.yml), without the render check.
  workflow_call:
    inputs:
      render:
        description: Run the render check.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which of the slow checks this change can affect. A pull request runs them only when it
  # touches what they check; anything that drives every check (scripts, dependencies, the
  # NSH baseline, CI itself) runs them all, and so does a run that is not a pull request.
  changes:
    runs-on: ubuntu-latest
    outputs:
      render: ${{ steps.paths.outputs.render }}
      install: ${{ steps.paths.outputs.install }}
      contract: ${{ steps.paths.outputs.contract }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Match the changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          RENDER_INPUT: ${{ inputs.render }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            if [ "$RENDER_INPUT" = "false" ]; then echo "render=false"; else echo "render=true"; fi >> "$GITHUB_OUTPUT"
            echo "install=true" >> "$GITHUB_OUTPUT"
            echo "contract=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          matches() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          all='^(scripts/|\.github/workflows/check\.yml|\.github/actions/|package\.json|bun\.lock|port-map\.json|references/)'
          render='^(packages/ui/|packages/theme/|apps/website/demos/)'
          install='^(packages/cli/|packages/ui/|packages/theme/|registry\.json|public/r/)'
          contract='^(packages/theme/|scripts/theme/|scripts/tokens/)'
          if [ "$(matches "$all")" = true ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "install=true" >> "$GITHUB_OUTPUT"
            echo "contract=true" >> "$GITHUB_OUTPUT"
          else
            echo "render=$(matches "$render")" >> "$GITHUB_OUTPUT"
            echo "install=$(matches "$install")" >> "$GITHUB_OUTPUT"
            echo "contract=$(matches "$contract")" >> "$GITHUB_OUTPUT"
          fi

  # Every change: about a minute.
  fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `port:check` compares the repo with references/nsh at the baseline.
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          nsh-channel: ${{ vars.NSH_CHANNEL }}

      # Type checks the demos, the gallery and the showcase app, and leaves the `.nsh` types hosts
      # (gitignored) that `vp check` resolves `nsh` and `nsh/base` from — as `bun run nsh:bootstrap`
      # does locally.
      - name: Type check the demos, the gallery and the showcase app
        run: bun run prepare:types

      # Format and lint, without `--fix`: CI reports what `bun run check` would change.
      - name: Format and lint
        run: bunx vp check

      - name: Catalog
        run: bun run catalog --check

      - name: Tokens build check
        run: bun run tokens:build --check

      - name: Theme roles
        run: bun run check:theme

      - name: Right-to-left sides
        run: bun run check:rtl

      # The port's gate: map complete, `// @port` regions equal to upstream, the
      # installed CLI against the baseline (docs/ARCHITECTURE.md P1–P3).
      - name: Port check
        run: bun run port:check

      - name: Port coverage
        run: bun run port:coverage

      # What apps install: public/r must be what registry.json builds.
      - name: Registry check
        run: bun run registry:build --check

      - name: Unit tests
        run: bun run test:unit

      - name: Docs pages
        run: bun run check:pages

      - name: Check the docs site
        run: bun run check:docs

  # The contract is frozen between versions (docs/decisions/0004-theme-contract-freeze.md):
  # adding or removing a key, or moving a source outside the theme values, needs a decision
  # record in the same pull request. Seconds, so it is its own job rather than part of `fast`.
  # The four changes that record authorizes (#340, #293 P6, #357, #358) pass with the
  # `theme-contract-freeze` label; both go away when the freeze lands.
  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `--gate` compares the branch with its base, and reads the files it adds.
          fetch-depth: 0

      # The gate reads git and the repo's own TypeScript: no dependencies to install.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Theme contract freeze
        env:
          # 0004 is the record for the four freeze changes: a pull request that says so with this
          # label moves the schema without a second record.
          FREEZE: ${{ contains(github.event.pull_request.labels.*.name, 'theme-contract-freeze') && '--freeze' || '' }}
        run: bun run theme:diff --gate "$BASE" ${FREEZE:-}

  # Each component's screenshot must equal the same page written against nsh/base
  # directly (P4). Four runners split the pages between them (`--shard`): the drawing is
  # nearly all of the time, the setup about twenty seconds.
  render:
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-latest
    env:
      # `--changed` needs the merge base, so the checkout below is full depth. A pull request
      # names its base; a push names the commit before it; a dispatch falls back to `origin/main`.
      BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: render (${{ matrix.shard }}/4)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          nsh-channel: ${{ vars.NSH_CHANNEL }}

      # `nsh test --target web` drives a headless Chrome, which the runner image has; say so
      # plainly when it does not.
      - name: Find Chrome
        run: |
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              "$browser" --version
              exit 0
            fi
          done
          echo "::error::no Chrome, Edge or Chromium on PATH: bun run port:render runs nsh test --target web in a headless browser"
          exit 1

      # The committed baseline was recorded on macOS; Linux draws text differently, so here
      # only the component ↔ reference pairs gate.
      - name: Render check
        run: bun run port:render --no-baseline --shard ${{ matrix.shard }}/4

      # The five themed passes, narrowed to what this change can move: a colour alone draws
      # nothing, a dimension only the themes that carry it, a contract every page in every theme.
      - name: Theme render check
        run: bun run port:render:theme --shard ${{ matrix.shard }}/4 --changed "$BASE"

      - name: Upload render screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-shots-${{ matrix.shard }}
          path: apps/website/demos/shots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-shots-${{ matrix.shard }}
          path: apps/website/demos/shots-theme
          if-no-files-found: ignore
          retention-days: 7

  # The registry as an app receives it (docs/port.md): `init` + `add` copy every item into a
  # real NSH app and `nsh check` it — the whole registry, and once per `registry:ui` item alone.
  install:
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          nsh-channel: ${{ vars.NSH_CHANNEL }}

      - name: Install test
        run: bun run test:install

  # The one status branch protection requires. A skipped job passed: the change could not
  # affect it.
  check:
    needs: [changes, fast, contract, render, install]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes fast contract render install: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
