name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # A release runs the same gate first (publish-cli.yml).
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces its run; each push keeps its own. The ref is in the
  # group too: a release tag's gate (publish-cli.yml calls this workflow) has the same sha as
  # the `main` run of that commit and must not cancel it.
  group: check-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  # Which of the slow checks this change can affect. A pull request runs them only when it
  # touches what they check; anything that drives every check (scripts, dependencies, CI
  # itself) runs them all, and so does a release pull request or a run that is not a pull request.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      install: ${{ steps.paths.outputs.install }}
      gallery: ${{ steps.paths.outputs.gallery }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Match the changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # A release pull request (CONTRIBUTING.md, Releasing) touches little, but the tag gate
          # runs every check on its commit: run them all here so a failure shows up before the tag.
          if [ "$EVENT" != "pull_request" ] || [[ "$HEAD_REF" == chore/release-* ]]; then
            echo "install=true" >> "$GITHUB_OUTPUT"
            echo "gallery=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          matches() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          all='^(scripts/|\.github/workflows/check\.yml|\.github/actions/|package\.json|bun\.lock)'
          # `nsh.json` decides what an installed app can import: the install test is the only place
          # that sees it, so a change to it is the install test's.
          install='^(packages/cli/|packages/ui/|packages/theme/|registry\.json|public/r/|nsh\.json)'
          gallery='^(packages/ui/|packages/theme/|apps/gallery/|apps/showcase/)'
          if [ "$(matches "$all")" = true ]; then
            echo "install=true" >> "$GITHUB_OUTPUT"
            echo "gallery=true" >> "$GITHUB_OUTPUT"
          else
            echo "install=$(matches "$install")" >> "$GITHUB_OUTPUT"
            echo "gallery=$(matches "$gallery")" >> "$GITHUB_OUTPUT"
          fi

  # Every change. The steps stay in step with `bun run check`, plus `test:unit`.
  # `vp check` has no `--fix`: CI reports what `bun run check` would change.
  # `prepare:types` is the three `nsh check`s.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          nsh-channel: ${{ vars.NSH_CHANNEL }}

      # What a release publishes: a broken bundle should not first show up on a tag. It is part of
      # `bun run check` too; here it runs first so it fails before the slow steps.
      - name: Build and type check the CLI
        run: bun run cli:build && bun --filter shadcn-nsh typecheck

      - name: Type check the demos, the gallery and the showcase app
        run: bun run prepare:types

      - name: Format and lint
        run: bunx vp check

      - name: Catalog
        run: bun run catalog --check

      - name: Theme checks
        run: bun run check:theme

      - name: UI checks
        run: bun run check:ui

      - name: Registry check
        run: bun run registry:build --check

      - name: Demo coverage
        run: bun run check:demos

      - name: Unit tests
        run: bun run test:unit

      - name: Docs pages
        run: bun run check:pages

      - name: Check the docs site
        run: bun run check:docs

  # What the components do in a running app: gallery fixtures on a native engine, and the
  # showcase shell. Neither needs a browser.
  gallery:
    needs: changes
    if: needs.changes.outputs.gallery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          nsh-channel: ${{ vars.NSH_CHANNEL }}

      - name: Gallery tests
        run: bun run test:gallery

      - name: Showcase tests
        run: nsh test apps/showcase

  # The registry as an app receives it: `init` + `add` copy every item into a real NSH app
  # and `nsh check` it.
  install:
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          nsh-channel: ${{ vars.NSH_CHANNEL }}

      - name: Install test
        run: bun run test:install

  # The one status branch protection requires. A skipped job passed: the change could not
  # affect it.
  check:
    needs: [changes, fast, gallery, install]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes fast gallery install: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
