name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install NSH (from source — release CLI lacks newer nsh/base exports used by packages/ui)
        run: |
          rustup target add wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y llvm
          curl -fsSL https://nsh.dev/install.sh | sh -s -- --source
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Prefer the toolchain that matches the NSH source checkout (edition 2024).
          echo "$(dirname "$(rustup which cargo)")" >> "$GITHUB_PATH"

      - name: Build docs
        run: bun run build:docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
