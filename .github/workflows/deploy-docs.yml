name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Installed with the official installer, never built; the installed CLI
      # carries the web runtimes `bun run docs:demos` packages the demos with
      # (docs/toolchain.md).
      - name: Setup NSH
        id: nsh
        uses: ./.github/actions/setup-nsh
        with:
          channel: ${{ vars.NSH_CHANNEL }}

      # Packaging the demos and the showcase app is most of the build; a commit
      # that leaves them, the library and the CLI as they were (a docs-site
      # change) reuses the last packages. Both outputs are cached together: a
      # hit skips `docs:demos`, which writes both. The key is exact: no
      # restore-keys, so a stale package is never deployed.
      - name: Cache packaged demos
        id: demos
        uses: actions/cache@v4
        with:
          path: |
            apps/website/public/demos
            apps/website/public/showcase
          key: demos-showcase-${{ runner.os }}-${{ steps.nsh.outputs.version }}-${{ hashFiles('apps/website/demos/**', '!apps/website/demos/baseline/**', '!apps/website/demos/shots*/**', 'packages/**', '!packages/**/node_modules/**', 'apps/showcase/**', '!apps/showcase/node_modules/**', 'apps/website/scripts/build-demos.ts', 'apps/website/scripts/package-web.ts', 'apps/website/scripts/player-options.ts', 'scripts/catalog.ts', 'bun.lock') }}

      - name: Build docs
        if: steps.demos.outputs.cache-hit != 'true'
        run: bun run build:docs

      - name: Build docs (demos from the cache)
        if: steps.demos.outputs.cache-hit == 'true'
        run: nsh check apps/website/demos && bun --filter @shadcn-nsh/website build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/website/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
