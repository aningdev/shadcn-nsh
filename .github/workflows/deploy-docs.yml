name: Deploy docs

# Two docs sites, one Pages site, built from the `site` branch (CONTRIBUTING.md, 发版):
# the root is the latest `v*` tag — the docs of what `npm i shadcn-nsh` installs — and `/dev/`
# is `main`. A `main` push rewrites only `dev/`; a `v*` tag rewrites the root and keeps `dev/`.
#
# A tag push runs the workflow as that tag has it, so tags cut after this landed publish
# themselves; an older tag (v0.9.0 predates the `site` branch) is published by dispatching this
# workflow — main's — with its tag as `ref`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: The `v*` tag to publish at the root
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the build to the `site` branch
      pages: write
      id-token: write
    steps:
      - name: Resolve what this run builds
        id: site
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ref="$INPUT_REF"
          else
            ref="$REF_NAME"
          fi

          # A push to `main` is the dev docs, at `<base>dev/`.
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$REF_TYPE" != "tag" ]; then
            {
              echo "channel=dev"
              echo "base=/dev/"
              echo "ref="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Everything else is a release: a tag push, or a tag named on dispatch.
          case "$ref" in
            v*) ;;
            *)
              echo "::error::'$ref' is not a release tag (v*)."
              exit 1
              ;;
          esac
          {
            echo "channel=release"
            echo "base=/"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

      # A release is built from its tag's tree: that tree's CLI (`engines.nsh`), lockfile
      # and demos are what the release documents.
      - uses: actions/checkout@v7
        with:
          # Empty for the dev docs: the push's own commit.
          ref: ${{ steps.site.outputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - uses: ./.github/actions/setup-nsh
        id: nsh
        with:
          channel: ${{ vars.NSH_CHANNEL }}

      # The packaged demos cost minutes; nothing in them depends on the docs base.
      - name: Cache packaged demos
        id: demos
        uses: actions/cache@v4
        with:
          path: |
            apps/website/public/demos
            apps/website/public/showcase
          key: demos-showcase-${{ runner.os }}-${{ steps.nsh.outputs.version }}-${{ hashFiles('apps/website/demos/**', '!apps/website/demos/baseline/**', '!apps/website/demos/shots*/**', 'packages/**', '!packages/**/node_modules/**', 'apps/showcase/**', '!apps/showcase/node_modules/**', 'apps/website/scripts/build-demos.ts', 'apps/website/scripts/package-web.ts', 'apps/website/scripts/player-options.ts', 'scripts/registry/catalog.ts', 'bun.lock') }}

      - name: Build docs
        if: steps.demos.outputs.cache-hit != 'true'
        env:
          DOCS_BASE: ${{ steps.site.outputs.base }}
        run: bun run build:docs

      - name: Build docs (demos from the cache)
        if: steps.demos.outputs.cache-hit == 'true'
        env:
          DOCS_BASE: ${{ steps.site.outputs.base }}
        run: nsh check apps/website/demos && bun --filter @shadcn-nsh/website build

      # The `site` branch is the published tree: the release at its root, `dev/` next to it. A
      # release replaces the root and leaves `dev/`; a dev build replaces only `dev/`. It is
      # checked out in a repository of its own, so the build's working tree never reaches the
      # branch.
      - name: Publish to the site branch
        env:
          CHANNEL: ${{ steps.site.outputs.channel }}
          # The checkout's credentials belong to the build's repository, not this one: the push
          # authenticates with the job token.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          git -C "$site" init -q
          git -C "$site" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin site >/dev/null 2>&1; then
            git -C "$site" fetch --depth=1 origin site
            git -C "$site" checkout -q -B site FETCH_HEAD
          else
            # First publish: an orphan branch, and the build below is its first commit.
            git -C "$site" checkout -q --orphan site
          fi

          if [ "$CHANNEL" = "dev" ]; then
            mkdir -p "$site/dev"
            rsync -a --delete --exclude=/.git --exclude=/dev "$PWD/apps/website/.output/public/" "$site/dev/"
          else
            rsync -a --delete --exclude=/.git --exclude=/dev "$PWD/apps/website/.output/public/" "$site/"
          fi
          touch "$site/.nojekyll"

          git -C "$site" add -A
          if git -C "$site" diff --cached --quiet; then
            echo "The $CHANNEL docs are unchanged; nothing to commit."
            exit 0
          fi
          git -C "$site" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "site: $CHANNEL docs from $GITHUB_SHA"
          git -C "$site" push origin "HEAD:refs/heads/site"

      # The checkout's repository is not part of the site.
      - name: Drop the site repository
        run: rm -rf "$RUNNER_TEMP/site/.git"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
