name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Store / GitHub release CLI (currently 0.4.0). Phase-1 UI only uses
      # nsh/base exports from this release — no cargo/source rebuild.
      - name: Cache NSH store install
        id: cache-nsh
        uses: actions/cache@v4
        with:
          path: ~/.nsh
          key: nsh-store-${{ runner.os }}-0.4.0
          restore-keys: |
            nsh-store-${{ runner.os }}-

      - name: Install NSH (store CLI release)
        run: |
          set -eu
          nsh_bin="$HOME/.nsh/bin/nsh"

          link_nsh() {
            mkdir -p "$HOME/.local/bin"
            ln -sfn "$nsh_bin" "$HOME/.local/bin/nsh"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          }

          if [ "${{ steps.cache-nsh.outputs.cache-hit }}" = "true" ] \
            && [ -x "$nsh_bin" ]; then
            echo "NSH store cache hit — skipping download"
            link_nsh
            "$HOME/.local/bin/nsh" -V
            exit 0
          fi

          curl -fsSL https://nsh.dev/install.sh | sh
          link_nsh
          "$HOME/.local/bin/nsh" -V

      - name: Build docs
        run: bun run build:docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
