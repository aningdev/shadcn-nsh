name: Setup
description: >-
  Bun, the dependencies and the NSH CLI: what every check job runs on, after its checkout.

inputs:
  nsh-channel:
    description: Passed to setup-nsh as `channel` (empty installs `port-map.json`'s `upstream.cli`).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Cache Bun package downloads
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # Installed with the official installer, never built; the baseline follows
    # the installed commit, so a moved nightly is a warning, not a failure
    # (docs/toolchain.md).
    - name: Setup NSH
      uses: ./.github/actions/setup-nsh
      with:
        channel: ${{ inputs.nsh-channel }}
