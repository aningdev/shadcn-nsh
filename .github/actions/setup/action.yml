name: Setup
description: >-
  Bun, the dependencies and the NSH CLI: what every check job runs on, after its checkout.

inputs:
  nsh-channel:
    description: Passed to setup-nsh as `channel` (empty installs `engines.nsh`).
    required: false
    default: ""
  web:
    description: >-
      Passed to setup-nsh as `web` — also cache the web runtime, which
      `nsh package --target web` needs.
    required: false
    default: "false"

outputs:
  nsh-version:
    description: What `nsh --version` printed (setup-nsh's `version`).
    value: ${{ steps.nsh.outputs.version }}

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Cache Bun package downloads
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # Installed with the official installer, never built. The version is engines.nsh.
    - name: Setup NSH
      id: nsh
      uses: ./.github/actions/setup-nsh
      with:
        channel: ${{ inputs.nsh-channel }}
        web: ${{ inputs.web }}
