name: Setup NSH
description: >-
  Install the NSH CLI with the official installer, cache `~/.nsh`, put `nsh` on
  PATH and print its version. Nothing is compiled, here or anywhere else: the
  project installs the CLI with `install.sh` (docs/toolchain.md).

  The baseline (`port-map.json`'s `upstream.commit`) is the commit the installed
  CLI prints, so an installed commit that differs from it is reported as a
  warning naming `bun run port:bump`, never as a failure — the nightly moves
  daily, and failing here would break every build until someone bumps.

inputs:
  channel:
    description: >-
      `nightly` (default) installs the nightly build of upstream `main`; a
      release tag such as `v0.5.0` installs that release instead. Pin a release
      while the nightly lags the baseline: a nightly older than it lacks the
      declarations the ported shells use.
    required: false
    default: nightly

outputs:
  version:
    description: What `nsh --version` printed.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    # The cache key is the UTC date: the nightly is rebuilt daily, so a new day
    # downloads once and every run that day restores `~/.nsh`.
    - name: Date the nightly
      id: day
      shell: bash
      run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Restore ~/.nsh
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.nsh
        key: nsh-${{ inputs.channel }}-${{ runner.os }}-${{ steps.day.outputs.day }}

    - name: Install the CLI
      id: install
      shell: bash
      env:
        NSH_CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        channel="${NSH_CHANNEL:-nightly}"
        if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
          if [ "$channel" = nightly ]; then
            curl -fsSL https://nsh.dev/install.sh | sh -s -- --nightly
          else
            curl -fsSL https://nsh.dev/install.sh | NSH_VERSION="$channel" sh
          fi
        fi
        [ -x "$HOME/.nsh/bin/nsh" ] || {
          echo "::error::~/.nsh/bin/nsh is missing: the cached CLI is incomplete, drop the nsh-$channel cache and re-run"
          exit 1
        }
        # The installer links ~/.local/bin/nsh, which the cache does not hold.
        mkdir -p "$HOME/.local/bin"
        ln -sfn "$HOME/.nsh/bin/nsh" "$HOME/.local/bin/nsh"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        version="$("$HOME/.local/bin/nsh" --version)"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        printf 'nsh: %s\n' "$version"

    # A warning, not a failure: the baseline follows the installed CLI, and the
    # nightly moves on its own (docs/toolchain.md).
    - name: Compare the installed commit with the baseline
      shell: bash
      run: |
        set -euo pipefail
        version="$(nsh --version)"
        cli="$(printf '%s\n' "$version" | sed -n 's/.*(\([0-9a-f]\{7,\}\).*/\1/p' | head -n 1)"
        baseline="$(node -p "require('./port-map.json').upstream.commit")"
        if [ -z "$cli" ]; then
          echo "::warning::the nsh CLI prints no commit ($version): the baseline is ${baseline:0:7}"
          exit 0
        fi
        case "$baseline" in
          "$cli"*) ;;
          *)
            echo "::warning::installed nightly $cli differs from the baseline ${baseline:0:7}: run \`bun run port:bump\` and commit the result"
            ;;
        esac
