name: Setup NSH
description: >-
  Install the NSH CLI with the official installer, cache `~/.nsh`, put `nsh` on
  PATH and print its version. Nothing is compiled: the project installs the CLI
  with `install.sh`. The version is `engines.nsh` in the root package.json.
  Runs after setup-bun: it reads that file with `bun -p`.

inputs:
  channel:
    description: >-
      What to install: a release tag such as `v0.7.2`, or `nightly`. Empty (the
      default) installs `engines.nsh` from the root package.json.
    required: false
    default: ""
  web:
    description: >-
      Also cache the web runtime (`nsh component add web`), which only
      `nsh package --target web` needs. It has a cache entry of its own, so jobs
      that never package for the web do not download it.
    required: false
    default: "false"

outputs:
  version:
    description: What `nsh --version` printed.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    # A release is fixed, so it caches by its tag; the nightly is rebuilt daily,
    # so it caches by the UTC date.
    - name: Choose the CLI
      id: day
      shell: bash
      env:
        NSH_CHANNEL: ${{ inputs.channel }}
        WEB: ${{ inputs.web }}
      run: |
        set -euo pipefail
        channel="${NSH_CHANNEL:-$(bun -p "require('./package.json').engines?.nsh || 'nightly'")}"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        if [ "$channel" = nightly ]; then day="$(date -u +%Y-%m-%d)"; else day=release; fi
        # The web runtime is optional: keeping it out of the plain cache keeps that
        # download off every job that does not package for the web.
        if [ "$WEB" = "true" ]; then day="$day-web"; fi
        echo "day=$day" >> "$GITHUB_OUTPUT"

    - name: Restore ~/.nsh
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.nsh
        key: nsh-${{ steps.day.outputs.channel }}-${{ runner.os }}-${{ steps.day.outputs.day }}

    - name: Install the CLI
      id: install
      shell: bash
      env:
        NSH_CHANNEL: ${{ steps.day.outputs.channel }}
        WEB: ${{ inputs.web }}
      run: |
        set -euo pipefail
        channel="$NSH_CHANNEL"
        if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
          if [ "$channel" = nightly ]; then
            curl -fsSL https://nsh.dev/install.sh | sh -s -- --nightly
          else
            curl -fsSL https://nsh.dev/install.sh | NSH_VERSION="$channel" sh
          fi
        fi
        [ -x "$HOME/.nsh/bin/nsh" ] || {
          echo "::error::~/.nsh/bin/nsh is missing: the cached CLI is incomplete, drop the nsh-$channel cache and re-run"
          exit 1
        }
        # The installer links ~/.local/bin/nsh, which the cache does not hold.
        mkdir -p "$HOME/.local/bin"
        ln -sfn "$HOME/.nsh/bin/nsh" "$HOME/.local/bin/nsh"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        # The installer leaves the web runtime out. Add it here, before anything packages, so
        # the cache holds it and the parallel packagers do not unpack it at the same time.
        if [ "$WEB" = "true" ] && [ ! -f "$HOME/.nsh/runtime/web/nsh-syntaxes.bin" ]; then
          "$HOME/.nsh/bin/nsh" component add web
        fi
        version="$("$HOME/.local/bin/nsh" --version)"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        printf 'nsh: %s\n' "$version"
